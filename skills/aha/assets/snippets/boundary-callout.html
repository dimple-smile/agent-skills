<!-- ============================================================
     snippet: boundary-callout —— 边界三件套（类比框 / 警示 / 大白话）
     ============================================================
     适用：
     · .analogy + .analogy-limit —— 直觉层（第 3 层）每个类比必配：
       不写"类比到此为止"这一行的类比不许上页
     · .callout-warn —— 会导致错误心智模型的误区（第 6 层）
     · .callout（info）/ .callout-accent —— "大白话：" 纠偏、关键强调
     规则：
     · 一个类比只讲一个映射；limit 行说清映射在哪里失效
     · 警示条必须有具体后果，不写空话（"注意安全"❌）
     ============================================================ -->

<!-- 类比 + 失效边界（直觉层） -->
<div class="analogy">
  <p><strong>把 X 想象成 Y。</strong>Y 的这个特性对应 X 的那个机制，
    读者靠对 Y 的既有经验建立直觉。</p>
  <p class="analogy-limit">Y 是静止的，而 X 每一步都在改写自身状态；
    类比不覆盖"随时间演化"这部分。</p>
</div>

<!-- 误区警示（边界层）：说清错误心智模型 + 真实情况 -->
<div class="callout callout-warn">
  <p><strong>常见误区：</strong>"X 会永久记住这些资料" —— 不对。
  X 只在这一次回答里临时携带它们，回答结束即丢弃，
  下一次提问要重新检索。</p>
</div>

<!-- 大白话纠偏（任意层） -->
<div class="callout">
  <p><strong>大白话：</strong>这一步像给资料做目录和位置卡，
  不是把资料塞进模型脑子里。</p>
</div>
